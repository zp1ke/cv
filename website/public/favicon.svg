<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Pastel coder blue background with subtle gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5B9BD5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4A7FB8;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="20" fill="url(#bgGradient)"/>

  <!-- MAT text with varying sizes and positions -->
  <!-- M - larger, positioned higher -->
  <text
    x="28"
    y="68"
    font-size="56"
    font-family="'Segoe UI', 'Roboto', 'Arial', sans-serif"
    font-weight="700"
    fill="white"
    text-anchor="middle"
    style="text-transform: uppercase;">M</text>

  <!-- A - smaller, middle position -->
  <text
    x="64"
    y="82"
    font-size="44"
    font-family="'Segoe UI', 'Roboto', 'Arial', sans-serif"
    font-weight="700"
    fill="white"
    text-anchor="middle"
    style="text-transform: uppercase;">A</text>

  <!-- T - larger, positioned lower -->
  <text
    x="100"
    y="96"
    font-size="56"
    font-family="'Segoe UI', 'Roboto', 'Arial', sans-serif"
    font-weight="700"
    fill="white"
    text-anchor="middle"
    style="text-transform: uppercase;">T</text>
</svg>
