name: Build and Deploy CV

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install TeXLive
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-xetex texlive-fonts-extra texlive-latex-extra

      - name: Build LaTeX PDFs
        run: |
          chmod +x ./scripts/build-resume.sh
          ./scripts/build-resume.sh en
          ./scripts/build-resume.sh es

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: website/package.json

      - name: Install website dependencies
        working-directory: ./website
        run: npm ci

      - name: Build Astro website
        working-directory: ./website
        run: npm run build

      - name: Copy PDFs to website
        run: |
          cp resume-en.pdf website/dist/
          cp resume-es.pdf website/dist/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./website/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
